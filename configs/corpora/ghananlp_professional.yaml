notes: >-
  6,090 rows, scraped from Ghanaian domestic sources, Wikipedia, novels and
  Bolingo, then translated by paid professional translators reading whole
  sentences for context. The card names Akuapem Twi, Asante Twi and other Akan
  variations without labelling rows individually, so claimed_variety records
  both and variety_audited stays false: a per-row variety audit is required
  before any result is attributed to the Akuapem primary condition.

  LICENCE CAVEAT: the card states CC BY 4.0 for the Twi-to-English files and
  gives a non-standard URL for the English-to-Twi direction. Treat the reverse
  direction as unlicensed until clarified.

  Held out entirely. This is the second human-authored evaluation set beside
  FLORES+, and being non-Wikinews-derived it is the check on whether gains
  transfer off the FLORES source domain.
