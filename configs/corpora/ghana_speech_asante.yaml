notes: >-
  Asante half of ghana-speech's Akan configs: 143,383 rows; `text` measures
  8,992,479 characters but only 5,948,509 over unique rows
  (the card-statistics estimate was 11,454,868).

  BIBLE READING WITH REPEATED CHAPTERS. `source_file` is chapter plus recording
  (`1CH.1.1461`, `1CH.1.1861`, `1CH.1.2094`). In the first 11,472 rows,
  recordings 1461 and 1861 read the same translation with identical
  transcripts, and 2094 reads a different translation ("Ɛfiri Adam So Kɔsi Noa
  Mma So" against "Ɛfiri Adam so de kɔsi Abraham so"). Documents are rebuilt
  per recording (group_by source_file, order_by id); the mixture's exact
  duplicate rule then keeps one of each identical reading — 211 distinct
  documents of 278 in that sample. Readings that differ only in segmentation
  remain near-duplicates.

  In m1x for volume. The no-pooling rule governs evaluation and
  variety-attributed claims, not what text enters the adaptation pool. Record in
  the data statement that Asante is the majority of m1x's variety-labelled text.
  FLORES+ Akuapem and Asante are still reported side by side.

  Provenance, translation copyright and variety labelling are unverified for the
  same reasons as the Akuapem config. 23.1 GB, almost all audio; extracted by
  akanlm.corpora.extract.
