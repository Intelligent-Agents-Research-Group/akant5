notes: >-
  The single largest Twi text source available to this project. 457,172 rows;
  the `twi` column measures a mean 4,316.50 characters (min 20, max 133,007),
  giving approximately 1,973,383,000 characters — on its own 143% of M1's
  entire current Twi volume of 1,382,673,183. Nothing else in the Ghana NLP
  or Ghana Open AI collections is within an order of magnitude of it.

  PROVENANCE IS A DIFFERENT PIPELINE FROM PRISTINE, and that is why this is
  declared `machine_translated` rather than `synthetic`. The card describes
  English generated by MiniCPM-5-1B from Ghana-context research prompts, then
  translated through the Google Translate API along `en -> th -> ak` — a Thai
  pivot. pristine-twi-english's Twi was instead Gemini-generated directly from
  Ghanaian news paragraph prompts. Both are model-produced and both are
  community-validated, but a pivot translation and a direct generation fail in
  different ways, so pooling them under one provenance label would hide the
  distinction a reviewer will ask about. The provenance summary should report
  the two shares separately.

  DEDUPLICATION IS MANDATORY BEFORE THIS ENTERS A MIXTURE. ghok-parallel and
  ghok-chat both cite the same pool of roughly 512k-534k Ghana-context source
  prompts, and `source_prompt` is a column here, so near-duplicate English —
  and therefore near-duplicate Twi — is likely within this set and possibly
  against pristine. Run the same check that retired pristine-twi: hash every
  normalized Twi string at the pinned revision and report the intersection
  with pristine_twi_english. Declaring both without that number repeats
  exactly the error the pristine audit caught.

  DOCUMENT LENGTH IS AN ADVANTAGE HERE. At a mean of 4,316 Twi characters per
  row these are essay-length documents, not sentences, so they pack into
  1024-token chunks with few cross-document boundaries and the packing
  provenance label (the document contributing most of a chunk) stays
  meaningful. The utterance-level speech corpora do the opposite.

  Mirrored at ghananlpcommunity/ghok-parallel-en-twi with the same row count.
  Declare one, pin it, and record the mirror so the manifest cannot
  double-count. 4.1 GB total across three string columns and no audio, so this
  one loads normally.

  The English column (mean 4,132.23 chars, ~1,889,139,000 total) is NOT a
  replay corpus: it is MiniCPM-generated text, not the mC4 web distribution
  mT5 was pretrained on. Use it for a paired objective only.
