# Four DDP replicas; batch = per-device batch x accumulation x 4 = 1,024.
# Match b200_2gpu microbatches/checkpointing and per-GPU memory; halve accumulation.
# Two CPU cores per rank, shared with its loaders.
description: Four B200 GPUs with two CPU cores and two data-loader workers per rank. Same per-GPU microbatches as b200_2gpu.
world_size: 4
per_device_train_batch_size:
  akant5-small: 64
  akant5-base: 32
  akant5-large: 8
gradient_accumulation_steps:
  akant5-small: 4
  akant5-base: 8
  akant5-large: 32
gradient_checkpointing:
  akant5-small: false
  akant5-base: false
  akant5-large: true
bf16: true
dataloader_num_workers: 2
ignore_data_skip: false
