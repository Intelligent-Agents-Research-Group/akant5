notes: >-
  Human-translated news, 3337 train / 1284 validation / 1500 test. The train
  and validation splits are used to fine-tune the MT probe in eval/mt_probe.py;
  they are task-tuning data, not pretraining data, and this source is marked
  eval_only so no mixture can pull it in.

  LOADING: masakhane/mafand is a script-based dataset and the repo contains only
  mafand.py. `datasets` no longer executes loading scripts, so it must be read
  from the auto-converted parquet branch:
    revision="refs/convert/parquet", path "en-twi/{train,validation,test}/*.parquet"
  akanlm.corpora.loaders handles this; see _load_mafand().

  Rows are {"translation": {"en": ..., "twi": ...}}.
