notes: >-
  The English side of FLORES+, and the only reason it is declared: the MT
  probe translates en->twi, and the Akuapem and Asante configs are monolingual
  Twi, so there is no source text without this.

  ALIGNMENT: FLORES+ language configs are sentence-parallel by row, and the
  shared `id` column makes that checkable rather than assumed. Verified at
  this revision: eng_Latn and twi_Latn_akua1239 devtest agree on all 1012 ids
  in order. akanlm.eval.mt_probe.load_flores_pairs re-checks the ids every
  time rather than trusting the ordering, because an index-wise pairing that
  has silently drifted still produces a perfectly plausible chrF++ score.

  This is English, so it is never training data for a Twi model and never an
  evaluation target on its own. role: eval_only keeps assert_trainable from
  handing it to a mixture; it exists only to be the source column of a pair.
